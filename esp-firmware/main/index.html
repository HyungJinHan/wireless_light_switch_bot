<html>
  <head>
    <title>Light Switch Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Light Switch Bot</h1>
      <h2>Current Status: <span id="status">Loading...</span></h2>
      <h2>
        Battery: <span id="battery-level">Loading...</span>% (<span
          id="battery-voltage"
          >...</span
        >V)
      </h2>
      <h2>Raw ADC: <span id="battery-adc">Loading...</span></h2>
      <h2>
        Voltage Range:
        <span id="battery-min-v">...</span>V ~
        <span id="battery-max-v">...</span>V
      </h2>

      <label class="switch">
        <input type="checkbox" id="toggle-checkbox" />
        <span class="slider round"></span>
      </label>
    </div>

    <script>
      const statusSpan = document.getElementById("status");
      const batterySpan = document.getElementById("battery-level");
      const voltageSpan = document.getElementById("battery-voltage");
      const adcSpan = document.getElementById("battery-adc");
      const minVSpan = document.getElementById("battery-min-v");
      const maxVSpan = document.getElementById("battery-max-v");
      const toggleCheckbox = document.getElementById("toggle-checkbox");

      function updateStatus() {
        fetch("/status")
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            statusSpan.innerText = data.status;
            toggleCheckbox.checked = data.status === "ON";
          })
          .catch((error) => {
            console.error("Could not fetch status:", error);
            statusSpan.innerText = "연결 실패";
            toggleCheckbox.checked = false;
          });
      }

      function updateBatteryLevel() {
        fetch("/battery")
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            if (data.level >= 0) {
              batterySpan.innerText = data.level;
              voltageSpan.innerText = data.voltage.toFixed(2);
              adcSpan.innerText = data.adc;
              minVSpan.innerText = data.min_v.toFixed(2);
              maxVSpan.innerText = data.max_v.toFixed(2);
            } else {
              batterySpan.innerText = "N/A";
              voltageSpan.innerText = "N/A";
              adcSpan.innerText = "N/A";
              minVSpan.innerText = "N/A";
              maxVSpan.innerText = "N/A";
            }
          })
          .catch((error) => {
            console.error("Could not fetch battery level:", error);
            batterySpan.innerText = "연결 실패";
            voltageSpan.innerText = "연결 실패";
            adcSpan.innerText = "연결 실패";
            minVSpan.innerText = "연결 실패";
            maxVSpan.innerText = "연결 실패";
          });
      }

      function toggleSwitch() {
        // 'change' 이벤트로 인해 체크박스 상태는 이미 낙관적으로 변경되었습니다.
        // 따라서, `!toggleCheckbox.checked`는 클릭 이전의 원래 상태를 나타냅니다.
        const originalCheckedState = !toggleCheckbox.checked;

        fetch("/toggle")
          .then(updateStatus) // 성공 시, 서버의 실제 상태와 UI를 다시 동기화합니다.
          .catch((error) => {
            console.error("Toggle command failed:", error);
            alert(
              "스위치 상태 변경에 실패했습니다. 연결을 확인 후 다시 시도해주세요."
            );

            // 통신 실패 시, UI를 원래 상태로 되돌려 사용자가 불일치를 인지하도록 합니다.
            toggleCheckbox.checked = originalCheckedState;
            statusSpan.innerText = originalCheckedState ? "ON" : "OFF";
          });
      }

      toggleCheckbox.addEventListener("change", toggleSwitch);

      // 페이지 로드 시 상태 가져오기
      updateStatus();
      updateBatteryLevel();

      // 30초마다 배터리 잔량 업데이트
      setInterval(updateBatteryLevel, 30000);
    </script>
  </body>
</html>
